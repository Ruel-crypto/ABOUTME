
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question 9 - The Name Test</title>
<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
}

.page {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
}

.card {
  width: min(680px, 100%);
  padding: clamp(22px, 5vw, 42px);
  background: white;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 15px 45px #0002;
}

.tag {
  display: inline-block;
  background: #e8eaff;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
}

h1 {
  font-size: clamp(26px, 5vw, 38px);
  margin: 18px 0 10px;
}

.subtitle {
  opacity: .7;
  line-height: 1.5;
}

.question {
  margin: 28px 0 20px;
  font-size: clamp(20px, 4vw, 27px);
  font-weight: 900;
  line-height: 1.4;
}

.choices {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.tile {
  min-height: 68px;
  padding: 15px 10px;
  border: 2px solid #e1e4ea;
  border-radius: 15px;
  background: #f8f9fc;
  font: inherit;
  font-size: clamp(15px, 3vw, 18px);
  font-weight: 800;
  cursor: pointer;
  transition: transform .2s, background .2s, border-color .2s;
}

.tile:hover:not(:disabled) {
  transform: translateY(-3px);
  border-color: #777;
}

.tile:disabled {
  cursor: default;
}

.tile.is-correct {
  background: #d7ffdf;
  border-color: #24a148;
}

.tile.is-wrong {
  background: #ffe0e0;
  border-color: #e53935;
}

.tile.is-faded {
  opacity: .5;
}

.feedback {
  min-height: 28px;
  margin-top: 18px;
  font-weight: 800;
}

.feedback.good {
  color: #16803c;
}

.feedback.bad {
  color: #d62828;
}

.next {
  display: inline-block;
  margin-top: 12px;
  padding: 14px 22px;
  border-radius: 12px;
  background: #222;
  color: white;
  text-decoration: none;
  font-weight: 900;
}

.next[hidden] {
  display: none;
}

@media (max-width: 420px) {
  .choices {
    grid-template-columns: 1fr;
  }

  .tile {
    min-height: 57px;
  }
}
</style>
</head>

<body data-step="9">

<main class="page">
<section class="card">

  <span class="tag">QUESTION 9 · THE NAME TEST 🫡</span>

  <h1>📢 What Did Ma'am Stephanie Call Me?</h1>

  <p class="subtitle">
    Let's see if you've been paying attention!
  </p>

  <div class="question">
    What is my name as bestowed by Ma'am Stephanie?
  </div>

  <div class="choices" id="choices">
    <button class="tile" type="button" data-correct="false">
      Sir Henry
    </button>

    <button class="tile" type="button" data-correct="false">
      Sir Juan
    </button>

    <button class="tile" type="button" data-correct="false">
      Sir Chad
    </button>

    <button class="tile" type="button" data-correct="true">
      Sir Francis
    </button>
  </div>

  <div id="feedback" class="feedback" aria-live="polite"></div>

  <a
    id="next"
    class="next"
    href="question10.html"
    hidden
  >
    Continue to Question 10 →
  </a>

</section>
</main>

<script src="effects.js"></script>

<script>
if (window.Quiz) {
  Quiz.multipleChoice({
    right: "CORRECT! 🫡 SIR FRANCIS AT YOUR SERVICE!",
    wrong: "MALI! SIR FRANCIS PO! 😭"
  });
}
</script>

</body>
</html>
