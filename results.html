<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results - About Me Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-step="6">
    <main class="stage">
      <section class="card results">
        <h1 class="q">Final score</h1>

        <div id="scored" hidden>
          <div class="big-score" aria-live="polite"><span id="num">0</span><small>/5</small></div>
          <p class="message" id="message"></p>
          <img class="result-gif" id="gif" alt="" hidden />
          <ul class="recap" id="recap"></ul>
        </div>

        <div id="empty" hidden>
          <p class="message">No score yet. Take the quiz first!</p>
        </div>

        <a class="btn" id="again" href="index.html">Play again</a>
      </section>
    </main>

    <script src="effects.js"></script>
    <script>
      const labels = [
        "Your name",
        "Richard's full name",
        "What he brought to the office",
        "What he enjoys outside of work",
        "Years of coding"
      ];

      const state = Quiz.state();
      const total = Quiz.total;

      if (state.answered === 0) {
        document.getElementById("empty").hidden = false;
        document.getElementById("again").textContent = "Start the quiz";
      } else {
        document.getElementById("scored").hidden = false;

        const percentage = Math.round((state.score / total) * 100);
        let message;
        if (percentage === 100) message = "Perfect! You know me so well! 🌟";
        else if (percentage >= 80) message = "Awesome! You really know me! 🎉";
        else if (percentage >= 60) message = "Good job! You know me pretty well. 😊";
        else if (percentage >= 40) message = "Not bad at all! We should hang out more. 😄";
        else message = "We need to get to know each other better! 😜";
        document.getElementById("message").textContent = message;

        // Happy GIF for 3 or more right, angry GIF otherwise.
        const good = state.score >= 3;
        const gifUrl = Quiz.gif(good);
        if (gifUrl) {
          const gif = document.getElementById("gif");
          gif.src = gifUrl;
          gif.alt = good ? "Happy reaction" : "Angry reaction";
          gif.hidden = false;
          gif.onerror = () => { gif.hidden = true; };
        }

        const recap = document.getElementById("recap");
        labels.forEach((label, i) => {
          const result = state.answers[i];
          const li = document.createElement("li");
          li.className = result === true ? "good" : "bad";
          li.innerHTML =
            '<span class="mark">' + (result === true ? "✓" : "✗") + "</span>" +
            '<span></span>';
          li.lastChild.textContent = label;
          recap.appendChild(li);
        });

        // Count up to the score.
        const num = document.getElementById("num");
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce || state.score === 0) {
          num.textContent = state.score;
        } else {
          let n = 0;
          const timer = setInterval(() => {
            n += 1;
            num.textContent = n;
            if (n >= state.score) clearInterval(timer);
          }, 220);
        }

        if (percentage >= 80) setTimeout(Quiz.confetti, 300);
      }

      document.getElementById("again").addEventListener("click", () => Quiz.reset());
    </script>
  </body>
</html>
