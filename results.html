<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Results</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container { width: 100%; max-width: 600px; }
      .card {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.25);
      }
      .top {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px 20px 20px;
        text-align: center;
      }
      h1 { margin: 0; font-size: 2.2em; }
      .content { padding: 30px 20px 40px; text-align: center; }
      .score {
        margin: 20px 0;
        font-size: 3em;
        font-weight: 800;
        color: #667eea;
      }
      .message {
        font-size: 1.2em;
        color: #555;
        margin-bottom: 25px;
      }
      .restart {
        display: inline-block;
        text-decoration: none;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 16px 28px;
        border-radius: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <header class="top">
          <h1>Final Score</h1>
        </header>
        <div class="content">
          <div class="score">5/5</div>
          <div class="message">Perfect! You know everything! 🌟</div>
          <a class="restart" href="index.html">Play Again</a>
        </div>
      </div>
    </div>
  </body>
</html>
