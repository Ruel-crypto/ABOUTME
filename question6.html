<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question 6 - Hungry Food Maze</title><link rel="stylesheet" href="style.css">
<style>
.maze-wrap{text-align:center}.maze{display:grid;grid-template-columns:repeat(15,1fr);width:min(600px,100%);aspect-ratio:1;margin:15px auto;border:5px solid #2b2438;border-radius:15px;overflow:hidden;background:#fff}.cell{display:grid;place-items:center;font-size:clamp(14px,3vw,25px);background:#fdfdfd}.wall{background:#413652}.food{cursor:default}.player{background:#d9f3ff}.finish{background:#dcffe8}.info{font-weight:800}.retry{display:none}.maze-btn{margin:6px}
</style></head>
<body data-step="6"><main class="stage"><header class="hud" id="hud"></header><section class="card maze-wrap"><h1 class="q">🍰 HUNGRY FOOD MAZE!</h1><p>Collect at least <b>3 good foods</b>, then reach the man at the end! Use the arrow keys.</p><div id="maze" class="maze"></div><p class="info" id="info">Good food: 0/3</p><button class="btn maze-btn retry" id="retry">Try again</button><a id="next" class="btn maze-btn" href="question7.html" hidden>Continue to Question 7 →</a></section></main><script src="effects.js"></script><script>
const grid=["111111111111111","100000100000001","101110101111101","100010100000101","111010111110101","100010000010101","101111111010101","100000001010101","101111101010101","101000001000101","101011111110101","101000000000101","101011111111101","100000000000001","111111111111111"],N=15,maze=document.getElementById("maze"),info=document.getElementById("info"),retry=document.getElementById("retry"),next=document.getElementById("next");let p,g;const foods=[{x:3,y:1,e:"☕"},{x:5,y:5,e:"🍞"},{x:9,y:7,e:"🧀"},{x:1,y:11,e:"🍝"},{x:11,y:11,e:"🍰",bad:true},{x:5,y:13,e:"🥤",bad:true}];
function start(){p={x:1,y:1};g=0;render();info.textContent="Good food: 0/3";retry.style.display="none";next.hidden=true}
function render(){maze.innerHTML="";for(let y=0;y<N;y++)for(let x=0;x<N;x++){let d=document.createElement("div");d.className="cell "+(grid[y][x]==="1"?"wall":"");let f=foods.find(a=>a.x===x&&a.y===y);if(f){d.textContent=f.e;d.classList.add("food")}if(p.x===x&&p.y===y){d.textContent="👩";d.classList.add("player")}if(x===13&&y===13){d.textContent="🧑";d.classList.add("finish")}maze.appendChild(d)}}
function move(dx,dy){let nx=p.x+dx,ny=p.y+dy;if(grid[ny][nx]==="1")return;p.x=nx;p.y=ny;let i=foods.findIndex(a=>a.x===p.x&&a.y===p.y);if(i>=0){let f=foods[i];if(f.bad){info.textContent="😱 OOPS! That's a trap food!";retry.style.display="inline-block";window.removeEventListener("keydown",key);return}else{g++;foods.splice(i,1);info.textContent=`Good food: ${g}/3`}}if(p.x===13&&p.y===13){if(g>=3){Quiz.answer(true,"You fed yourself and reached the finish! 🍰","Not enough good food!",()=>{});next.hidden=false}else{info.textContent="You need at least 3 good foods!";retry.style.display="inline-block";return}}render()}
function key(e){let m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();move(...m)}}
retry.onclick=start;window.addEventListener("keydown",key);start();
</script></body></html>
