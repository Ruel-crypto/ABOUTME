<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 1 - About Me Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-step="1">
    <main class="stage">
      <header class="hud" id="hud"></header>

      <section class="card">
        <h1 class="q">What's your name?</h1>
        <form id="gate" autocomplete="off">
          <label class="sr" for="answer">Your name</label>
          <input class="text-input" id="answer" type="text" placeholder="Enter your name..." autofocus />
          <button class="btn" type="submit">Submit</button>
        </form>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>
    </main>

    <script src="effects.js"></script>
    <script>
      Quiz.textGate({
        answers: ["jamaica"],
        right: "That's you! Let's go.",
        wrong: "Wrong name, try again! 👀",
        next: "question2.html"
      });
    </script>
  </body>
</html>
