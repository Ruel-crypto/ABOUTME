<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 3 - About Me Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-step="3">
    <main class="stage">
      <header class="hud" id="hud"></header>

      <section class="card">
        <h1 class="q">What's the first thing Richard brought to the office?</h1>
        <p class="hint">Draw a loaf of bread — a square or rectangle bread slice.</p>

        <canvas id="pad" class="pad" width="300" height="300" aria-label="Drawing area. Draw with your mouse or finger."></canvas>

        <div class="pad-actions">
          <button class="btn ghost" id="clearBtn" type="button">Clear</button>
          <button class="btn" id="submitBtn" type="button">Submit drawing</button>
        </div>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <a id="next" class="btn" href="question4.html" hidden>Next question</a>
      </section>
    </main>

    <script src="effects.js"></script>
    <script>
      const pad = document.getElementById("pad");
      const ctx = pad.getContext("2d");
      const clearBtn = document.getElementById("clearBtn");
      const submitBtn = document.getElementById("submitBtn");
      const feedback = document.getElementById("feedback");

      let drawing = false;
      let locked = false;

      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#1a1033";

      // The canvas is shown at different sizes on different screens,
      // so convert screen position to canvas position.
      function position(event) {
        const rect = pad.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) * pad.width) / rect.width,
          y: ((event.clientY - rect.top) * pad.height) / rect.height
        };
      }

      pad.addEventListener("pointerdown", (event) => {
        if (locked) return;
        drawing = true;
        pad.setPointerCapture(event.pointerId);
        const p = position(event);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 0.01, p.y); // so a single tap leaves a dot
        ctx.stroke();
      });

      pad.addEventListener("pointermove", (event) => {
        if (!drawing) return;
        const p = position(event);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });

      const stop = () => { drawing = false; };
      pad.addEventListener("pointerup", stop);
      pad.addEventListener("pointercancel", stop);

      clearBtn.addEventListener("click", () => {
        if (locked) return;
        ctx.clearRect(0, 0, pad.width, pad.height);
      });

      submitBtn.addEventListener("click", () => {
        if (locked) return;

        const data = ctx.getImageData(0, 0, pad.width, pad.height).data;
        let filled = 0;
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] > 20) filled++;
        }

        if (filled === 0) {
          feedback.className = "feedback show";
          feedback.textContent = "Draw something first, then submit.";
          return;
        }

        locked = true;
        clearBtn.disabled = true;
        submitBtn.disabled = true;

        const isCorrect = filled > 1500;
        Quiz.answer(
          isCorrect,
          "That's bread! 🍞",
          "Not quite. It was a loaf of sliced bread! 🍞"
        );
      });
    </script>
  </body>
</html>
