<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question 3</title><link rel="stylesheet" href="style.css"><style>.draw{text-align:center}.pad{width:min(300px,100%);height:auto;background:#fff;border:3px dashed #9b83d7;border-radius:12px;touch-action:none}.tools{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px}.color{width:38px;height:38px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 1px #bbb;cursor:pointer}.small{padding:9px 13px;border:0;border-radius:10px;font-weight:800}</style></head><body data-step="3"><main class="stage"><header class="hud" id="hud"></header><section class="card draw"><h1 class="q">What's the first thing Richard brought to the office?</h1><p>Clue: it's a square. Draw a <b>BROWN</b> square. 🟫</p><canvas id="pad" class="pad" width="300" height="300"></canvas><div class="tools" id="colors"></div><div class="tools"><button class="small" id="clear">Clear</button><button class="btn" id="submit">Submit drawing</button></div><p id="feedback" class="feedback"></p><a id="next" class="btn next" href="question4.html" hidden>Next question →</a></section></main><script src="effects.js"></script><script>
const c=document.getElementById("pad"),x=c.getContext("2d"),colors=["#e53935","#1e66f5","#fdd835","#1a1033","#8b5a2b","#fb8c00","#2e9e4f"];let col="#1a1033",drawing=false,minX=999,minY=999,maxX=-1,maxY=-1,brown=0;
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
function down(e){drawing=true;let p=point(e);x.strokeStyle=col;x.lineWidth=7;x.lineCap="round";x.beginPath();x.moveTo(p.x,p.y);track(p)}
function move(e){if(!drawing)return;let p=point(e);x.lineTo(p.x,p.y);x.stroke();track(p)}
function up(){drawing=false}
function track(p){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);if(col==="#8b5a2b")brown++}
c.addEventListener("pointerdown",down);c.addEventListener("pointermove",move);window.addEventListener("pointerup",up);
colors.forEach(v=>{let b=document.createElement("button");b.className="color";b.style.background=v;b.onclick=()=>col=v;document.getElementById("colors").appendChild(b)});
document.getElementById("clear").onclick=()=>{x.clearRect(0,0,300,300);minX=999;minY=999;maxX=-1;maxY=-1;brown=0};
document.getElementById("submit").onclick=()=>{let w=maxX-minX+1,h=maxY-minY+1,ok=w>=70&&h>=70&&w/h>.6&&w/h<1.67&&brown>20;if(!ok){document.getElementById("feedback").className="feedback show bad";document.getElementById("feedback").textContent="✗ Draw a clear brown square! 🟫";showReaction(false,()=>{}) ;return}Quiz.answer(true,"Correct! That's the square! 🟫","Try the square again!",()=>{});document.getElementById("next").hidden=false};
</script></body></html>
