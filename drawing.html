<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 3 - About Me Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-step="3">
    <main class="stage">
      <header class="hud" id="hud"></header>

      <section class="card">
        <h1 class="q">What's the first thing Richard brought to the office?</h1>
        <p class="hint">Clue: it's a square. Pick a color and draw it.</p>

        <canvas id="pad" class="pad" width="300" height="300" aria-label="Drawing area. Draw with your mouse or finger."></canvas>

        <div class="palette" id="palette" role="group" aria-label="Colors"></div>
        <p class="color-name" id="colorName">Color: Black</p>

        <div class="toolbar" role="group" aria-label="Tools">
          <button class="tool" id="penBtn" type="button" aria-pressed="true">Pen</button>
          <button class="tool" id="fillBtn" type="button" aria-pressed="false">Fill</button>
          <button class="tool" id="undoBtn" type="button">Undo</button>
          <button class="tool" id="clearBtn" type="button">Clear</button>
        </div>

        <button class="btn" id="submitBtn" type="button">Submit drawing</button>

        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <a id="next" class="btn" href="question4.html" hidden>Next question</a>
      </section>
    </main>

    <script src="effects.js"></script>
    <script>
      /* RULES START
         The answer is correct when the drawing is a SQUARE and it uses BROWN.
         Other colors are fine. Tweak the numbers below if it is too strict or too easy. */

      // The 7 colors people can pick.
      const PALETTE = [
        { name: "Red", hex: "#e53935" },
        { name: "Blue", hex: "#1e66f5" },
        { name: "Yellow", hex: "#fdd835" },
        { name: "Black", hex: "#1a1033" },
        { name: "Brown", hex: "#8b5a2b" },
        { name: "Orange", hex: "#fb8c00" },
        { name: "Green", hex: "#2e9e4f" }
      ];
      PALETTE.forEach((c) => {
        c.rgb = [1, 3, 5].map((i) => parseInt(c.hex.slice(i, i + 2), 16));
      });

      // Brown rule
      const BROWN_NAME = "Brown";
      const BROWN_MIN_SHARE = 0.2;  // brown must be at least this share of everything drawn
      const BROWN_MIN_PIXELS = 300; // ...and not just a tiny dot

      // Square rule (the canvas is 300 pixels wide)
      const MIN_SIDE = 70;         // smallest allowed square, in pixels
      const MIN_RATIO = 0.6;       // width / height must be between these two,
      const MAX_RATIO = 1.67;      // so slightly stretched squares still count
      const BAND = 0.12;           // how far from the edge a line may wobble (share of the size)
      const CORNER = 0.14;         // each corner of the drawing needs some ink this close
      const MIN_SIDE_COVER = 0.65; // each of the 4 sides must be drawn along at least this much

      // Fill tool
      const FILL_SOLID = 200;      // pixels with this much ink (0-255) count as a line
      const MAX_FILL_AREA = 0.7;   // a fill bigger than this share of the canvas is refused

      // Says whether the drawing is a square (or close to one), in any color.
      function looksLikeSquare(data, size) {
        const ink = new Uint8Array(size * size);
        let minX = size, maxX = -1, minY = size, maxY = -1, count = 0;

        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            if (data[(y * size + x) * 4 + 3] > 20) {
              ink[y * size + x] = 1;
              count++;
              if (x < minX) minX = x;
              if (x > maxX) maxX = x;
              if (y < minY) minY = y;
              if (y > maxY) maxY = y;
            }
          }
        }
        if (count === 0) return false;

        const w = maxX - minX + 1;
        const h = maxY - minY + 1;
        if (w < MIN_SIDE || h < MIN_SIDE) return false;
        const ratio = w / h;
        if (ratio < MIN_RATIO || ratio > MAX_RATIO) return false;

        const bandX = Math.max(10, Math.round(w * BAND));
        const bandY = Math.max(10, Math.round(h * BAND));

        // Share of one side that has a line near it.
        function coverAlongX(yFrom, yTo) {
          let hit = 0;
          for (let x = minX; x <= maxX; x++) {
            for (let y = yFrom; y <= yTo; y++) {
              if (ink[y * size + x]) { hit++; break; }
            }
          }
          return hit / w;
        }
        function coverAlongY(xFrom, xTo) {
          let hit = 0;
          for (let y = minY; y <= maxY; y++) {
            for (let x = xFrom; x <= xTo; x++) {
              if (ink[y * size + x]) { hit++; break; }
            }
          }
          return hit / h;
        }

        const top = coverAlongX(minY, Math.min(maxY, minY + bandY - 1));
        const bottom = coverAlongX(Math.max(minY, maxY - bandY + 1), maxY);
        const left = coverAlongY(minX, Math.min(maxX, minX + bandX - 1));
        const right = coverAlongY(Math.max(minX, maxX - bandX + 1), maxX);
        if (Math.min(top, bottom, left, right) < MIN_SIDE_COVER) return false;

        // A square has ink in all four corners. A circle or triangle does not.
        const cw = Math.max(8, Math.round(w * CORNER));
        const ch = Math.max(8, Math.round(h * CORNER));
        function hasInk(xFrom, yFrom) {
          for (let y = yFrom; y < yFrom + ch; y++) {
            for (let x = xFrom; x < xFrom + cw; x++) {
              if (ink[y * size + x]) return true;
            }
          }
          return false;
        }
        return hasInk(minX, minY) && hasInk(maxX - cw + 1, minY) &&
               hasInk(minX, maxY - ch + 1) && hasInk(maxX - cw + 1, maxY - ch + 1);
      }

      // Says whether enough of the drawing is brown. Other colors are allowed.
      function usesBrown(data) {
        let total = 0, brown = 0;
        for (let i = 0; i < data.length; i += 4) {
          if (data[i + 3] <= 20) continue;
          total++;
          let best = -1, bestDist = Infinity;
          for (let k = 0; k < PALETTE.length; k++) {
            const c = PALETTE[k].rgb;
            const dr = data[i] - c[0], dg = data[i + 1] - c[1], db = data[i + 2] - c[2];
            const dist = dr * dr + dg * dg + db * db;
            if (dist < bestDist) { bestDist = dist; best = k; }
          }
          if (PALETTE[best].name === BROWN_NAME) brown++;
        }
        return total > 0 && brown >= BROWN_MIN_PIXELS && brown / total >= BROWN_MIN_SHARE;
      }

      // Paint bucket. Colors the closed area around (startX, startY).
      // Returns how many pixels were colored, or -1 if the area is not closed.
      function floodFill(data, size, startX, startY, rgb) {
        const sx = Math.floor(startX), sy = Math.floor(startY);
        if (sx < 0 || sy < 0 || sx >= size || sy >= size) return -1;

        const si = (sy * size + sx) * 4;
        const tr = data[si], tg = data[si + 1], tb = data[si + 2];
        const targetSolid = data[si + 3] >= FILL_SOLID;

        function matches(i) {
          const solid = data[i + 3] >= FILL_SOLID;
          if (!targetSolid) return !solid;
          if (!solid) return false;
          const dr = data[i] - tr, dg = data[i + 1] - tg, db = data[i + 2] - tb;
          return dr * dr + dg * dg + db * db < 2400;
        }

        const seen = new Uint8Array(size * size);
        const hits = [];
        const stack = [sx, sy];
        while (stack.length) {
          const y = stack.pop();
          const x = stack.pop();
          if (x < 0 || y < 0 || x >= size || y >= size) continue;
          const p = y * size + x;
          if (seen[p]) continue;
          seen[p] = 1;
          if (!matches(p * 4)) continue;
          hits.push(p);
          stack.push(x + 1, y, x - 1, y, x, y + 1, x, y - 1);
        }

        if (!targetSolid && hits.length > size * size * MAX_FILL_AREA) return -1;

        for (const p of hits) {
          data[p * 4] = rgb[0];
          data[p * 4 + 1] = rgb[1];
          data[p * 4 + 2] = rgb[2];
          data[p * 4 + 3] = 255;
        }
        return hits.length;
      }
      /* RULES END */

      const pad = document.getElementById("pad");
      const ctx = pad.getContext("2d", { willReadFrequently: true });
      const paletteBox = document.getElementById("palette");
      const colorName = document.getElementById("colorName");
      const penBtn = document.getElementById("penBtn");
      const fillBtn = document.getElementById("fillBtn");
      const undoBtn = document.getElementById("undoBtn");
      const clearBtn = document.getElementById("clearBtn");
      const submitBtn = document.getElementById("submitBtn");
      const feedback = document.getElementById("feedback");

      let drawing = false;
      let locked = false;
      let tool = "pen";
      let color = PALETTE[3]; // starts on black
      const history = [];

      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      // ----- Color buttons -----
      PALETTE.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.style.setProperty("--sw", c.hex);
        b.setAttribute("aria-label", c.name);
        b.setAttribute("title", c.name);
        b.setAttribute("aria-pressed", c === color ? "true" : "false");
        b.addEventListener("click", () => {
          if (locked) return;
          color = c;
          colorName.textContent = "Color: " + c.name;
          paletteBox.querySelectorAll(".swatch").forEach((s) => {
            s.setAttribute("aria-pressed", s === b ? "true" : "false");
          });
        });
        paletteBox.appendChild(b);
      });

      // ----- Tools -----
      function setTool(name) {
        tool = name;
        penBtn.setAttribute("aria-pressed", String(name === "pen"));
        fillBtn.setAttribute("aria-pressed", String(name === "fill"));
        pad.style.cursor = name === "fill" ? "cell" : "crosshair";
      }
      penBtn.addEventListener("click", () => { if (!locked) setTool("pen"); });
      fillBtn.addEventListener("click", () => { if (!locked) setTool("fill"); });

      function saveForUndo() {
        history.push(ctx.getImageData(0, 0, pad.width, pad.height));
        if (history.length > 30) history.shift();
      }

      function clearHint() {
        feedback.className = "feedback";
        feedback.textContent = "";
      }

      undoBtn.addEventListener("click", () => {
        if (locked || !history.length) return;
        ctx.putImageData(history.pop(), 0, 0);
        clearHint();
      });

      clearBtn.addEventListener("click", () => {
        if (locked) return;
        saveForUndo();
        ctx.clearRect(0, 0, pad.width, pad.height);
        clearHint();
      });

      // ----- Drawing -----
      // The canvas is shown at different sizes on different screens,
      // so convert screen position to canvas position.
      function position(event) {
        const rect = pad.getBoundingClientRect();
        return {
          x: ((event.clientX - rect.left) * pad.width) / rect.width,
          y: ((event.clientY - rect.top) * pad.height) / rect.height
        };
      }

      pad.addEventListener("pointerdown", (event) => {
        if (locked) return;
        clearHint();
        const p = position(event);

        if (tool === "fill") {
          const image = ctx.getImageData(0, 0, pad.width, pad.height);
          const painted = floodFill(image.data, pad.width, p.x, p.y, color.rgb);
          if (painted < 0) {
            feedback.className = "feedback show";
            feedback.textContent = "Tap inside a closed shape to fill it.";
            return;
          }
          saveForUndo();
          ctx.putImageData(image, 0, 0);
          return;
        }

        saveForUndo();
        drawing = true;
        pad.setPointerCapture(event.pointerId);
        ctx.strokeStyle = color.hex;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + 0.01, p.y); // so a single tap leaves a dot
        ctx.stroke();
      });

      pad.addEventListener("pointermove", (event) => {
        if (!drawing) return;
        const p = position(event);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      });

      const stop = () => { drawing = false; };
      pad.addEventListener("pointerup", stop);
      pad.addEventListener("pointercancel", stop);

      // ----- Submit -----
      submitBtn.addEventListener("click", () => {
        if (locked) return;

        const data = ctx.getImageData(0, 0, pad.width, pad.height).data;
        let empty = true;
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] > 20) { empty = false; break; }
        }

        if (empty) {
          feedback.className = "feedback show";
          feedback.textContent = "Draw something first, then submit.";
          return;
        }

        locked = true;
        document.querySelectorAll(".swatch, .tool, #submitBtn").forEach((b) => { b.disabled = true; });

        const isSquare = looksLikeSquare(data, pad.width);
        const isBrown = usesBrown(data);

        let wrongText;
        if (isSquare && !isBrown) wrongText = "Right shape, but it's not brown. It was a slice of bread! 🍞";
        else if (!isSquare && isBrown) wrongText = "Brown is right, but that's not a square. It was a slice of bread! 🍞";
        else wrongText = "That's not a brown square. It was a slice of bread! 🍞";

        Quiz.answer(isSquare && isBrown, "A brown square. That's bread! 🍞", wrongText);
      });
    </script>
  </body>
</html>
