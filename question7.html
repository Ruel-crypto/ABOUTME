<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Question 7 - Help Me Get To Work!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Bricolage Grotesque", sans-serif;
  overflow-x: hidden;
}

/* =========================
   MAIN CARD
========================= */

.game-page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 14px;
}

.game-card {
  width: min(1050px, 100%);
  background: rgba(255,255,255,.97);
  border-radius: 26px;
  padding: 20px;
  box-shadow: 0 18px 55px rgba(0,0,0,.18);
}

/* =========================
   HEADER
========================= */

.game-header {
  text-align: center;
  margin-bottom: 12px;
}

.game-header h1 {
  margin: 0 0 5px;
  font-size: clamp(23px, 4vw, 40px);
}

.game-header p {
  margin: 0;
  opacity: .7;
  font-size: clamp(13px, 2vw, 17px);
}

/* =========================
   HUD
========================= */

.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.hud-box {
  background: #f0f2f5;
  border-radius: 12px;
  padding: 8px 13px;
  font-weight: 800;
  font-size: 14px;
}

.timer {
  min-width: 85px;
  text-align: center;
}

.timer.danger {
  animation: pulse .45s infinite alternate;
}

@keyframes pulse {
  from {
    transform: scale(1);
  }

  to {
    transform: scale(1.1);
  }
}

/* =========================
   GAME WINDOW
========================= */

.game-window {
  position: relative;
  width: 100%;
  height: clamp(280px, 48vw, 440px);

  overflow: hidden;

  border: 4px solid #222;
  border-radius: 20px;

  background:
    linear-gradient(
      to bottom,
      #82d7ff 0%,
      #c8f0ff 67%,
      #e9faff 100%
    );

  isolation: isolate;
}

/* =========================
   CLOUDS
========================= */

.cloud {
  position: absolute;
  z-index: 1;

  font-size: 45px;

  opacity: .75;

  pointer-events: none;

  animation: cloudMove linear infinite;
}

.cloud1 {
  top: 25px;
  left: 10%;
  animation-duration: 16s;
}

.cloud2 {
  top: 80px;
  left: 65%;
  animation-duration: 22s;
}

@keyframes cloudMove {

  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-180px);
  }

}

/* =========================
   CITY
========================= */

.city {
  position: absolute;

  bottom: 67px;
  left: 0;

  width: 200%;

  display: flex;
  gap: 12px;

  align-items: flex-end;

  animation: cityMove 7s linear infinite;

  pointer-events: none;
}

.city span {
  display: block;

  width: 80px;

  height: var(--height);

  background: rgba(75,95,115,.3);

  border-radius: 6px 6px 0 0;
}

@keyframes cityMove {

  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-50%);
  }

}

/* =========================
   ROAD
========================= */

.ground {
  position: absolute;

  z-index: 2;

  bottom: 0;
  left: 0;

  width: 200%;
  height: 70px;

  background:
    repeating-linear-gradient(
      90deg,
      #343434 0 65px,
      #3d3d3d 65px 130px
    );

  border-top: 7px solid #72b638;

  animation: roadMove .55s linear infinite;
}

@keyframes roadMove {

  from {
    transform: translateX(0);
  }

  to {
    transform: translateX(-130px);
  }

}

/* =========================
   PLAYER
========================= */

.player {
  position: absolute;

  z-index: 20;

  left: 13%;
  bottom: 59px;

  width: clamp(55px, 9vw, 88px);

  height: auto;

  user-select: none;
  pointer-events: none;

  transform-origin: center bottom;
}

.player.running {
  animation: running .16s infinite alternate;
}

@keyframes running {

  from {
    transform:
      translateY(0)
      rotate(-2deg);
  }

  to {
    transform:
      translateY(-6px)
      rotate(2deg);
  }

}

.player.jumping {
  animation: none;
}

/* =========================
   DUST
========================= */

.dust {
  position: absolute;

  z-index: 18;

  left: 8%;
  bottom: 59px;

  font-size: 34px;

  pointer-events: none;

  animation: dust .25s infinite alternate;
}

@keyframes dust {

  from {
    transform: scale(.8);
    opacity: .45;
  }

  to {
    transform: scale(1.1);
    opacity: .9;
  }

}

/* =========================
   OFFICE
========================= */

.office {
  position: absolute;

  z-index: 5;

  right: 18px;
  bottom: 62px;

  font-size: clamp(55px, 9vw, 95px);
}

/* =========================
   OBSTACLES
========================= */

.obstacle {

  position: absolute;

  z-index: 15;

  right: -100px;
  bottom: 57px;

  font-size: clamp(42px, 7vw, 70px);

  line-height: 1;

  pointer-events: none;

  will-change: right;
}

.obstacle.car {
  font-size: clamp(50px, 9vw, 85px);
}

.obstacle.cart {
  font-size: clamp(45px, 8vw, 75px);
}

/* =========================
   ANIMALS
========================= */

.animal {

  position: absolute;

  z-index: 16;

  right: -100px;

  bottom: 57px;

  top: auto;

  font-size: clamp(42px, 7vw, 70px);

  line-height: 1;

  pointer-events: none;

  will-change: right, transform;

  animation: animalWalk .35s infinite alternate;
}

@keyframes animalWalk {

  from {
    transform:
      translateY(0)
      rotate(-2deg);
  }

  to {
    transform:
      translateY(-4px)
      rotate(2deg);
  }

}

/* =========================
   DANGER BANNER
========================= */

.danger-banner {

  position: absolute;

  z-index: 50;

  top: 12px;
  left: 50%;

  transform:
    translateX(-50%)
    translateY(-80px);

  background: #e63946;

  color: white;

  padding: 8px 16px;

  border-radius: 999px;

  font-weight: 800;

  white-space: nowrap;

  opacity: 0;

  transition: .35s ease;
}

.danger-banner.show {

  transform:
    translateX(-50%)
    translateY(0);

  opacity: 1;
}

/* =========================
   CONTROLS
========================= */

.controls {

  display: flex;

  justify-content: center;

  margin-top: 12px;
}

.jump-btn {

  width: min(280px, 100%);

  min-height: 58px;

  border: 0;

  border-radius: 16px;

  background: #222;

  color: white;

  font: inherit;

  font-size: 19px;

  font-weight: 800;

  cursor: pointer;

  box-shadow: 0 6px 0 #000;

  touch-action: manipulation;
}

.jump-btn:active {

  transform: translateY(4px);

  box-shadow: 0 2px 0 #000;
}

.instructions {

  margin: 10px 0 0;

  text-align: center;

  opacity: .6;

  font-size: 13px;
}

/* =========================
   RESULT SCREEN
========================= */

.game-result {

  position: absolute;

  z-index: 100;

  inset: 0;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 18px;

  background: rgba(0,0,0,.68);

  backdrop-filter: blur(4px);
}

.game-result.show {
  display: flex;
}

.result-box {

  width: min(480px, 100%);

  background: white;

  border-radius: 22px;

  padding: 27px;

  text-align: center;
}

.result-box h2 {

  margin: 0 0 8px;

  font-size: clamp(27px, 6vw, 43px);
}

.result-box p {

  margin: 0 0 18px;
}

.result-buttons {

  display: flex;

  justify-content: center;

  gap: 9px;

  flex-wrap: wrap;
}

.result-buttons button,
.result-buttons a {

  padding: 12px 18px;

  border: 0;

  border-radius: 12px;

  font: inherit;

  font-weight: 800;

  cursor: pointer;

  text-decoration: none;
}

.retry {

  background: #222;

  color: white;
}

.continue {

  background: #19a974;

  color: white;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px) {

  .game-page {

    padding: 7px;

    align-items: flex-start;
  }

  .game-card {

    margin-top: 6px;

    padding: 12px;

    border-radius: 19px;
  }

  .game-window {

    height: 58vh;

    min-height: 300px;

    max-height: 420px;
  }

  .hud-box {

    padding: 7px 9px;

    font-size: 12px;
  }

  .game-header h1 {

    font-size: 24px;
  }

  .game-header p {

    font-size: 12px;
  }

  .instructions {

    font-size: 11px;
  }

}

/* Very small phones */

@media(max-width:380px) {

  .game-window {

    height: 330px;
  }

  .game-header h1 {

    font-size: 21px;
  }

  .hud-box {

    font-size: 10px;

    padding: 6px 7px;
  }

}

</style>
</head>

<main class="game-page">

<section class="game-card">

<header class="game-header">

  </p>

<!-- HUD -->

<div class="hud">

<!-- GAME -->

<div

>

  <!-- Clouds -->

  </div>

  </div>


  <!-- Background city -->

  <div class="city">

    <span style="--height:90px"></span>
    <span style="--height:130px"></span>
    <span style="--height:75px"></span>

    <span style="--height:105px"></span>
    <span style="--height:135px"></span>

<script src="effects.js"></script>


<script>

(() => {

  const game =
    document.getElementById("game");

  const player =
    document.getElementById("player");

  const timer =
    document.getElementById("timer");

  const status =
    document.getElementById("status");

  const danger =
    document.getElementById("danger");

  const result =
    document.getElementById("result");

  const resultTitle =
    document.getElementById("resultTitle");

  const resultText =
    document.getElementById("resultText");

  const retryBtn =
    document.getElementById("retry");

  const continueBtn =
    document.getElementById("continueBtn");

  const jumpBtn =
    document.getElementById("jump");


  let running = false;

  let dead = false;

  let jumping = false;


  let startTime = 0;

  let lastTime = 0;

  let jumpStart = 0;


  let obstacleTimer = 0;

  let animalTimer = 0;


  let obstacles = [];

  let animals = [];


  let animationFrame;


  const TOTAL_TIME = 20000;


  /* =========================
     RESET
  ========================= */

  function resetGame() {

    cancelAnimationFrame(animationFrame);


    obstacles.forEach(item => {

      if (item.el.parentNode) {
        item.el.remove();
      }

    });


    animals.forEach(item => {

      if (item.el.parentNode) {
        item.el.remove();
      }

    });


    obstacles = [];

    animals = [];


    running = true;

    dead = false;

    jumping = false;


    startTime =
      performance.now();

    lastTime =
      startTime;


    obstacleTimer = 1000;

    animalTimer = 0;


    timer.textContent =
      "20.0s";

    status.textContent =
      "RUN!";


    timer.classList.remove(
      "danger"
    );

    danger.classList.remove(
      "show"
    );


    player.classList.add(
      "running"
    );

    player.classList.remove(
      "jumping"
    );


    player.style.bottom =
      "59px";


    result.classList.remove(
      "show"
    );


    retryBtn.hidden =
      false;

    continueBtn.hidden =
      true;


    animationFrame =
      requestAnimationFrame(loop);
  }


  /* =========================
     JUMP
  ========================= */

  function jump() {

    if (
      !running ||
      dead ||
      jumping
    ) {
      return;
    }


    jumping = true;

    jumpStart =
      performance.now();


    player.classList.remove(
      "running"
    );

    player.classList.add(
      "jumping"
    );


    animateJump();
  }


  function animateJump() {

    if (
      !jumping ||
      dead
    ) {
      return;
    }


    const elapsed =
      performance.now() -
      jumpStart;


    const duration = 700;


    const progress =
      Math.min(
        elapsed / duration,
        1
      );


    const height =
      Math.sin(
        progress * Math.PI
      ) * 150;


    player.style.bottom =
      (59 + height) + "px";


    if (
      progress >= 1
    ) {

      jumping = false;


      player.style.bottom =
        "59px";


      player.classList.remove(
        "jumping"
      );

      player.classList.add(
        "running"
      );


      return;
    }


    requestAnimationFrame(
      animateJump
    );

  }


  /* =========================
     CREATE OBSTACLE
  ========================= */

  function createObstacle() {

    const obstacle =
      document.createElement(
        "div"
      );


    const random =
      Math.random();


    if (random < .35) {

      obstacle.textContent =
        "📦";

      obstacle.className =
        "obstacle";

    }

    else if (random < .60) {

      obstacle.textContent =
        "🛒";

      obstacle.className =
        "obstacle cart";

    }

    else if (random < .82) {

      obstacle.textContent =
        "🚗";

      obstacle.className =
        "obstacle car";

    }

    else {

      obstacle.textContent =
        "🪑";

      obstacle.className =
        "obstacle";

    }


    obstacle.style.right =
      "-100px";


    game.appendChild(
      obstacle
    );


    obstacles.push({

      el: obstacle,

      x:
        game.clientWidth + 100

    });

  }


  /* =========================
     CREATE ANIMAL
  ========================= */

  function createAnimal() {

    const animal =
      document.createElement(
        "div"
      );


    /*
     * CAT OR DOG
     */

    animal.textContent =
      Math.random() < .5
        ? "🐱"
        : "🐶";


    animal.className =
      "animal";


    /*
     * IMPORTANT:
     * They start on the ROAD.
     * They do NOT fall from the sky.
     */

    animal.style.right =
      "-100px";

    animal.style.bottom =
      "57px";


    game.appendChild(
      animal
    );


    animals.push({

      el: animal,

      x:
        game.clientWidth + 100

    });

  }


  /* =========================
     COLLISION
  ========================= */

  function collision(
    playerRect,
    obstacleRect
  ) {

    /*
     * Smaller hitbox = fairer game.
     */

    const playerLeft =
      playerRect.left +
      playerRect.width * .25;

    const playerRight =
      playerRect.right -
      playerRect.width * .25;

    const playerTop =
      playerRect.top +
      playerRect.height * .20;

    const playerBottom =
      playerRect.bottom -
      playerRect.height * .05;


    const obstacleLeft =
      obstacleRect.left +
      obstacleRect.width * .15;

    const obstacleRight =
      obstacleRect.right -
      obstacleRect.width * .15;

    const obstacleTop =
      obstacleRect.top +
      obstacleRect.height * .15;

    const obstacleBottom =
      obstacleRect.bottom;


    return (

      playerRight >
        obstacleLeft &&

      playerLeft <
        obstacleRight &&

      playerBottom >
        obstacleTop &&

      playerTop <
        obstacleBottom

    );

  }


  /* =========================
     CHECK COLLISIONS
  ========================= */

  function checkCollisions() {

    /*
     * Can't get hit while
     * jumping.
     */

    if (jumping) {
      return;
    }


    const playerRect =
      player.getBoundingClientRect();


    /* OBSTACLES */

    for (
      const item of obstacles
    ) {

      const rect =
        item.el.getBoundingClientRect();


      if (
        collision(
          playerRect,
          rect
        )
      ) {

        die();

        return;
      }

    }


    /* ANIMALS */

    for (
      const item of animals
    ) {

      const rect =
        item.el.getBoundingClientRect();


      if (
        collision(
          playerRect,
          rect
        )
      ) {

        die();

        return;
      }

    }

  }


  /* =========================
     DIE
  ========================= */

  function die() {

    if (dead) {
      return;
    }


    dead = true;

    running = false;


    cancelAnimationFrame(
      animationFrame
    );


    player.classList.remove(
      "running"
    );


    resultTitle.textContent =
      "💀 YOU KILLED ME!";


    resultText.textContent =
      "I trusted you... 😭 You hit something! Try again.";


    retryBtn.hidden =
      false;

    continueBtn.hidden =
      true;


    result.classList.add(
      "show"
    );

  }


  /* =========================
     WIN
  ========================= */

  function win() {

    running = false;


    cancelAnimationFrame(
      animationFrame
    );


    timer.textContent =
      "0.0s";


    status.textContent =
      "SAFE!";


    player.classList.remove(
      "running"
    );


    resultTitle.textContent =
      "🏢 YOU SAVED ME!";


    resultText.textContent =
      "I KNEW I COULD TRUST YOU! I made it to work! 🎉 +1 POINT";


    retryBtn.hidden =
      true;

    continueBtn.hidden =
      false;


    result.classList.add(
      "show"
    );


    /*
     * Record Q7 as correct.
     */

    if (
      window.Quiz &&
      Quiz.answer
    ) {

      Quiz.answer(

        true,

        "YOU SAVED ME! I KNEW I COULD TRUST YOU!",

        "You didn't make it to work."

      );

    }


    if (
      window.Quiz &&
      Quiz.confetti
    ) {

      Quiz.confetti();

    }

  }


  /* =========================
     MAIN LOOP
  ========================= */

  function loop(now) {

    if (
      !running ||
      dead
    ) {
      return;
    }


    const delta =
      now - lastTime;


    lastTime =
      now;


    const elapsed =
      now - startTime;


    const remaining =
      Math.max(
        0,
        TOTAL_TIME - elapsed
      );


    timer.textContent =
      (remaining / 1000)
        .toFixed(1)
      + "s";


    /* =====================
       FIRST 10 SECONDS
       EASY MODE
    ===================== */

    if (
      elapsed < 10000
    ) {

      obstacleTimer -=
        delta;


      if (
        obstacleTimer <= 0
      ) {

        createObstacle();


        /*
         * Slow obstacle
         * frequency.
         */

        obstacleTimer =
          1300 +
          Math.random() * 800;

      }

    }


    /* =====================
       10-20 SECONDS
       DANGER MODE
    ===================== */

    else {

      if (
        !danger.classList.contains(
          "show"
        )
      ) {

        danger.classList.add(
          "show"
        );


        timer.classList.add(
          "danger"
        );


        status.textContent =
          "DANGER!";

      }


      /*
       * MORE OBSTACLES
       */

      obstacleTimer -=
        delta;


      if (
        obstacleTimer <= 0
      ) {

        createObstacle();


        obstacleTimer =
          750 +
          Math.random() * 550;

      }


      /*
       * CATS AND DOGS
       */

      animalTimer -=
        delta;


      if (
        animalTimer <= 0
      ) {

        createAnimal();


        /*
         * Animals are
         * spaced out.
         */

        animalTimer =
          1300 +
          Math.random() * 1000;

      }

    }


    /* =====================
       MOVE OBSTACLES
    ===================== */

    const obstacleSpeed =
      elapsed >= 10000
        ? 390
        : 270;


    obstacles.forEach(
      item => {

        item.x -=
          obstacleSpeed *
          delta /
          1000;


        /*
         * Move from RIGHT
         * toward LEFT.
         */

        item.el.style.right =
          (
            game.clientWidth -
            item.x
          ) + "px";

      }
    );


    /*
     * Remove passed obstacles.
     */

    obstacles =
      obstacles.filter(
        item => {

          if (
            item.x < -150
          ) {

            item.el.remove();

            return false;

          }

          return true;

        }
      );


    /* =====================
       MOVE ANIMALS
    ===================== */

    const animalSpeed =
      150;


    animals.forEach(
      item => {

        /*
         * Slow walking speed.
         */

        item.x -=
          animalSpeed *
          delta /
          1000;


        item.el.style.right =
          (
            game.clientWidth -
            item.x
          ) + "px";

      }
    );


    /*
     * Remove animals after
     * they pass the player.
     */

    animals =
      animals.filter(
        item => {

          if (
            item.x < -150
          ) {

            item.el.remove();

            return false;

          }

          return true;

        }
      );


    /* COLLISION */

    checkCollisions();


    /* WIN */

    if (
      remaining <= 0
    ) {

      win();

      return;

    }


    animationFrame =
      requestAnimationFrame(
        loop
      );

  }


  /* =========================
     KEYBOARD
  ========================= */

  document.addEventListener(
    "keydown",
    e => {

      if (
        e.code === "ArrowUp" ||
        e.code === "Space"
      ) {

        e.preventDefault();

        jump();

      }

    }
  );


  /* =========================
     MOBILE BUTTON
  ========================= */

  jumpBtn.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      jump();

    }
  );


  /* =========================
     RETRY
  ========================= */

  retryBtn.addEventListener(
    "click",
    resetGame
  );


  /* START */

  resetGame();

})();

</script>

</body>
</html>
