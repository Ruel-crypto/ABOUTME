<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question 7 - Get Me To Work!</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Bricolage Grotesque", sans-serif;
  overflow-x: hidden;
}

.game-page {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 18px;
}

.game-card {
  width: min(1100px, 100%);
  padding: 22px;
  border-radius: 28px;
  background: rgba(255,255,255,.96);
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
}

.game-header {
  text-align: center;
  margin-bottom: 15px;
}

.game-header h1 {
  margin: 0 0 6px;
  font-size: clamp(24px, 4vw, 42px);
}

.game-header p {
  margin: 0;
  font-size: clamp(14px, 2vw, 18px);
  opacity: .75;
}

.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
}

.hud-box {
  background: #f1f3f7;
  border-radius: 14px;
  padding: 9px 15px;
  font-weight: 700;
}

.timer {
  min-width: 100px;
  text-align: center;
}

.timer.danger {
  animation: pulse .5s infinite alternate;
}

@keyframes pulse {
  from { transform: scale(1); }
  to { transform: scale(1.08); }
}

/* GAME */

.game-window {
  position: relative;
  width: 100%;
  height: clamp(280px, 48vw, 470px);
  overflow: hidden;
  border-radius: 22px;
  background: linear-gradient(#8ed8ff 0%, #c9f1ff 65%, #eefcff 100%);
  border: 4px solid #222;
  isolation: isolate;
}

.sky {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.cloud {
  position: absolute;
  width: 100px;
  height: 35px;
  border-radius: 30px;
  background: rgba(255,255,255,.8);
  filter: blur(.2px);
  animation: cloudMove linear infinite;
}

.cloud:before,
.cloud:after {
  content: "";
  position: absolute;
  background: inherit;
  border-radius: 50%;
}

.cloud:before {
  width: 45px;
  height: 45px;
  left: 18px;
  top: -22px;
}

.cloud:after {
  width: 55px;
  height: 55px;
  right: 10px;
  top: -30px;
}

.cloud1 {
  top: 45px;
  left: 10%;
  animation-duration: 18s;
}

.cloud2 {
  top: 90px;
  left: 60%;
  transform: scale(.7);
  animation-duration: 24s;
}

@keyframes cloudMove {
  from { margin-left: 0; }
  to { margin-left: -160px; }
}

.city {
  position: absolute;
  bottom: 75px;
  left: 0;
  width: 200%;
  height: 130px;
  display: flex;
  align-items: flex-end;
  gap: 12px;
  animation: cityMove 7s linear infinite;
}

.building-bg {
  flex: 0 0 80px;
  height: var(--h);
  background: rgba(85,105,130,.35);
  border-radius: 5px 5px 0 0;
}

@keyframes cityMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

.ground {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 200%;
  height: 78px;
  background:
    repeating-linear-gradient(
      90deg,
      #333 0 55px,
      #3b3b3b 55px 110px
    );
  border-top: 8px solid #75b83b;
  animation: groundMove .65s linear infinite;
}

@keyframes groundMove {
  from { transform: translateX(0); }
  to { transform: translateX(-110px); }
}

/* PLAYER */

.player {
  position: absolute;
  z-index: 10;
  width: clamp(55px, 9vw, 92px);
  height: auto;
  left: 12%;
  bottom: 68px;
  object-fit: contain;
  transform-origin: center bottom;
  user-select: none;
  pointer-events: none;
  transition: transform .12s ease;
}

.player.running {
  animation: runBob .18s infinite alternate;
}

.player.jump {
  animation: none;
}

@keyframes runBob {
  from {
    transform: translateY(0) rotate(-2deg);
  }
  to {
    transform: translateY(-7px) rotate(2deg);
  }
}

.player.flip {
  transform: scaleX(-1);
}

/* DUST */

.dust {
  position: absolute;
  z-index: 8;
  width: 55px;
  height: 40px;
  left: 8%;
  bottom: 64px;
  object-fit: contain;
  opacity: .7;
  animation: dustPop .3s infinite alternate;
  pointer-events: none;
}

@keyframes dustPop {
  from {
    transform: scale(.8);
    opacity: .35;
  }
  to {
    transform: scale(1.05);
    opacity: .8;
  }
}

/* OBSTACLES */

.obstacle {
  position: absolute;
  z-index: 9;
  bottom: 67px;
  right: -130px;
  width: clamp(48px, 8vw, 80px);
  height: auto;
  object-fit: contain;
  pointer-events: none;
}

.obstacle.car {
  width: clamp(75px, 13vw, 125px);
}

.obstacle.cart {
  width: clamp(60px, 10vw, 95px);
}

/* ANIMALS */

.animal {
  position: absolute;
  z-index: 11;
  width: clamp(45px, 8vw, 75px);
  height: auto;
  right: -100px;
  top: -100px;
  object-fit: contain;
  pointer-events: none;
}

.animal.falling {
  animation: animalDrop 1.3s linear forwards;
}

@keyframes animalDrop {
  0% {
    transform: translate(0,0) rotate(-15deg);
  }
  100% {
    transform: translate(-40vw, 430px) rotate(40deg);
  }
}

/* OFFICE */

.office {
  position: absolute;
  z-index: 7;
  right: 20px;
  bottom: 69px;
  width: clamp(85px, 13vw, 145px);
  max-height: 180px;
  object-fit: contain;
  transition: transform .5s ease;
}

.office.arrived {
  animation: officeBounce .6s ease;
}

@keyframes officeBounce {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

/* DANGER */

.danger-banner {
  position: absolute;
  z-index: 30;
  top: 12px;
  left: 50%;
  transform: translateX(-50%) translateY(-100px);
  padding: 9px 18px;
  border-radius: 999px;
  background: #e63946;
  color: white;
  font-weight: 800;
  white-space: nowrap;
  opacity: 0;
  transition: .35s ease;
  box-shadow: 0 8px 20px rgba(0,0,0,.2);
}

.danger-banner.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* CONTROLS */

.controls {
  display: flex;
  justify-content: center;
  margin-top: 15px;
}

.jump-btn {
  width: min(260px, 100%);
  min-height: 60px;
  border: 0;
  border-radius: 18px;
  background: #222;
  color: white;
  font-size: 20px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 7px 0 #000;
  touch-action: manipulation;
}

.jump-btn:active {
  transform: translateY(5px);
  box-shadow: 0 2px 0 #000;
}

.instructions {
  text-align: center;
  margin: 12px 0 0;
  font-size: 14px;
  opacity: .65;
}

/* RESULT */

.game-result {
  position: absolute;
  z-index: 100;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(10,15,25,.72);
  backdrop-filter: blur(5px);
}

.game-result.show {
  display: flex;
}

.result-box {
  width: min(500px, 100%);
  padding: 30px;
  border-radius: 24px;
  background: white;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}

.result-box h2 {
  margin: 0 0 10px;
  font-size: clamp(28px, 6vw, 45px);
}

.result-box p {
  margin: 0 0 20px;
  font-size: 17px;
}

.result-buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.result-buttons button,
.result-buttons a {
  border: 0;
  border-radius: 13px;
  padding: 13px 20px;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
}

.retry {
  background: #222;
  color: white;
}

.continue {
  background: #19a974;
  color: white;
}

/* MOBILE */

@media (max-width: 600px) {
  .game-page {
    padding: 8px;
    align-items: flex-start;
  }

  .game-card {
    margin-top: 8px;
    padding: 13px;
    border-radius: 20px;
  }

  .game-header {
    margin-bottom: 10px;
  }

  .game-window {
    height: 58vh;
    min-height: 300px;
    max-height: 430px;
  }

  .office {
    right: 8px;
  }

  .player {
    left: 11%;
  }

  .hud-box {
    padding: 7px 10px;
    font-size: 13px;
  }

  .instructions {
    font-size: 12px;
  }
}
</style>
</head>

<body data-step="7">

<main class="game-page">

  <section class="game-card">

    <header class="game-header">
      <h1>🏃 HELP ME GET TO WORK!</h1>
      <p>I'm late for work! I trust you. Don't let me die! 😭</p>
    </header>

    <div class="hud">
      <div class="hud-box">
        ❤️ Don't die!
      </div>

      <div class="hud-box timer" id="timer">
        20.0s
      </div>

      <div class="hud-box" id="status">
        RUN!
      </div>
    </div>

    <div class="game-window" id="game">

      <div class="sky">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
      </div>

      <div class="city">
        <div class="building-bg" style="--h:90px"></div>
        <div class="building-bg" style="--h:125px"></div>
        <div class="building-bg" style="--h:70px"></div>
        <div class="building-bg" style="--h:145px"></div>
        <div class="building-bg" style="--h:100px"></div>
        <div class="building-bg" style="--h:135px"></div>
        <div class="building-bg" style="--h:80px"></div>
        <div class="building-bg" style="--h:120px"></div>
        <div class="building-bg" style="--h:90px"></div>
        <div class="building-bg" style="--h:125px"></div>
      </div>

      <img
        class="office"
        id="office"
        src="https://png.pngtree.com/png-clipart/20231020/original/pngtree-3d-illustration-of-offices-building-png-image_13378690.png"
        alt="Office"
      >

      <img
        class="dust"
        src="https://tse4.mm.bing.net/th/id/OIP.D5yDhjmSLrzYOS3j_lZKeQHaEy?r=0&pid=Api&h=220&P=0"
        alt=""
      >

      <img
        class="player running"
        id="player"
        src="https://pngimg.com/uploads/businessman/businessman_PNG6583.png"
        alt="Man running to work"
      >

      <div class="ground"></div>

      <div class="danger-banner" id="danger">
        ⚠️ DANGER MODE! THEY'RE COMING!
      </div>

      <div class="game-result" id="result">

        <div class="result-box">

          <h2 id="resultTitle"></h2>

          <p id="resultText"></p>

          <div class="result-buttons">

            <button class="retry" id="retry">
              🔄 TRY AGAIN
            </button>

            <a class="continue" id="continueBtn" href="question8.html" hidden>
              Continue to Question 8 →
            </a>

          </div>

        </div>

      </div>

    </div>

    <div class="controls">
      <button class="jump-btn" id="jump">
        ⬆️ JUMP
      </button>
    </div>

    <p class="instructions">
      Press <b>↑ UP ARROW</b> or <b>SPACE</b> to jump • Survive for 20 seconds!
    </p>

  </section>

</main>

<script src="effects.js"></script>

<script>
(() => {

  const game = document.getElementById("game");
  const player = document.getElementById("player");
  const timer = document.getElementById("timer");
  const status = document.getElementById("status");
  const danger = document.getElementById("danger");
  const result = document.getElementById("result");
  const resultTitle = document.getElementById("resultTitle");
  const resultText = document.getElementById("resultText");
  const retryBtn = document.getElementById("retry");
  const continueBtn = document.getElementById("continueBtn");
  const office = document.getElementById("office");
  const jumpBtn = document.getElementById("jump");

  const MAN =
    "https://pngimg.com/uploads/businessman/businessman_PNG6583.png";

  const BOX =
    "https://png.pngtree.com/png-clipart/20221014/original/pngtree-simulation-wooden-box-wooden-box-png-image_8686302.png";

  const CART =
    "https://tse1.mm.bing.net/th/id/OIP.jevjfxxlO1nZRGcnhEWJFwHaHa?r=0&pid=Api&h=220&P=0";

  const EXTRA_OBSTACLE =
    "https://tse2.mm.bing.net/th/id/OIP.S8z5YyJdX_yerUGa7oARcgHaF7?r=0&pid=Api&h=220&P=0";

  const CAT =
    "https://tse1.mm.bing.net/th/id/OIP.293z1xvNG6tZt0pS05ShLQHaGH?r=0&pid=Api&h=220&P=0";

  const DOG =
    "https://pngimg.com/uploads/dog/dog_PNG50381.png";

  let running = false;
  let dead = false;
  let startTime = 0;
  let lastTime = 0;
  let animationId = null;
  let jumped = false;
  let jumpStart = 0;
  let obstacleTimer = 0;
  let animalTimer = 0;
  let obstacles = [];
  let animals = [];

  const GAME_TIME = 20000;

  function clearObjects() {

    obstacles.forEach(o => o.remove());
    animals.forEach(a => a.remove());

    obstacles = [];
    animals = [];
  }

  function resetGame() {

    cancelAnimationFrame(animationId);

    clearObjects();

    running = true;
    dead = false;
    jumped = false;

    startTime = performance.now();
    lastTime = startTime;

    obstacleTimer = 800;
    animalTimer = 0;

    timer.textContent = "20.0s";
    status.textContent = "RUN!";
    timer.classList.remove("danger");
    danger.classList.remove("show");

    player.src = MAN;
    player.classList.add("running");
    player.classList.remove("jump");
    player.style.bottom = "68px";
    player.style.transform = "";

    office.classList.remove("arrived");

    result.classList.remove("show");
    retryBtn.hidden = false;
    continueBtn.hidden = true;

    animationId = requestAnimationFrame(loop);
  }

  function jump() {

    if (!running || dead || jumped) return;

    jumped = true;
    jumpStart = performance.now();

    player.classList.remove("running");
    player.classList.add("jump");

    animateJump();
  }

  function animateJump() {

    if (!jumped || dead) return;

    const elapsed = performance.now() - jumpStart;
    const duration = 650;

    const progress = Math.min(elapsed / duration, 1);

    const height = Math.sin(progress * Math.PI) * 155;

    player.style.bottom = (68 + height) + "px";

    if (progress >= 1) {

      jumped = false;
      player.style.bottom = "68px";
      player.classList.remove("jump");
      player.classList.add("running");

      return;
    }

    requestAnimationFrame(animateJump);
  }

  function createObstacle() {

    const img = document.createElement("img");

    const type = Math.random();

    if (type < .5) {
      img.src = BOX;
      img.className = "obstacle box";
    } else if (type < .8) {
      img.src = CART;
      img.className = "obstacle cart";
    } else {
      img.src = EXTRA_OBSTACLE;
      img.className = "obstacle car";
    }

    img.alt = "";
    game.appendChild(img);
    obstacles.push(img);
  }

  function createAnimal() {

    const img = document.createElement("img");

    img.src = Math.random() < .5 ? CAT : DOG;
    img.className = "animal falling";
    img.alt = "";

    img.style.right = (-60 - Math.random() * 30) + "px";
    img.style.top = (15 + Math.random() * 80) + "px";

    game.appendChild(img);
    animals.push(img);

    setTimeout(() => {

      if (img.parentNode) {
        img.remove();
      }

      animals = animals.filter(a => a !== img);

    }, 1500);
  }

  function moveObstacles(delta, elapsed) {

    const speed = elapsed >= 10000 ? 420 : 290;

    obstacles.forEach((o, index) => {

      const current = parseFloat(o.dataset.x || "0");

      const x = current - speed * delta / 1000;

      o.dataset.x = x;
      o.style.right = (-x) + "px";

      if (x < -180) {

        o.remove();
        obstacles.splice(index, 1);
      }
    });
  }

  function collision(a, b) {

    const r1 = a.getBoundingClientRect();
    const r2 = b.getBoundingClientRect();

    const pad = 12;

    return !(
      r1.right - pad < r2.left ||
      r1.left + pad > r2.right ||
      r1.bottom - pad < r2.top ||
      r1.top + pad > r2.bottom
    );
  }

  function checkCollisions() {

    if (jumped) return;

    for (const obstacle of obstacles) {

      if (collision(player, obstacle)) {

        die();
        return;
      }
    }
  }

  function die() {

    if (dead) return;

    dead = true;
    running = false;

    cancelAnimationFrame(animationId);

    player.classList.remove("running");

    resultTitle.textContent = "💀 YOU KILLED ME!";

    resultText.textContent =
      "I trusted you... but that box/cart/car got me! 😭 Try again!";

    retryBtn.hidden = false;
    continueBtn.hidden = true;

    result.classList.add("show");

    if (window.Quiz && Quiz.answer) {
      /*
       * Q7 is recorded as wrong only if the player actually dies.
       */
    }
  }

  function win() {

    if (dead) return;

    running = false;

    cancelAnimationFrame(animationId);

    timer.textContent = "0.0s";
    status.textContent = "MADE IT!";

    player.classList.remove("running");

    office.classList.add("arrived");

    resultTitle.textContent = "🏢 YOU SAVED ME!";

    resultText.textContent =
      "I KNEW I COULD TRUST YOU! I made it to work! +1 POINT 🎉";

    retryBtn.hidden = true;
    continueBtn.hidden = false;

    result.classList.add("show");

    if (window.Quiz && Quiz.answer) {

      Quiz.answer(
        true,
        "YOU SAVED ME! I KNEW I COULD TRUST YOU!",
        "You didn't make it to work."
      );
    }

    if (window.Quiz && Quiz.confetti) {
      Quiz.confetti();
    }
  }

  function loop(now) {

    if (!running || dead) return;

    const delta = now - lastTime;
    lastTime = now;

    const elapsed = now - startTime;
    const remaining = Math.max(0, GAME_TIME - elapsed);

    const seconds = remaining / 1000;

    timer.textContent = seconds.toFixed(1) + "s";

    if (elapsed >= 10000) {

      if (!danger.classList.contains("show")) {

        danger.classList.add("show");
        timer.classList.add("danger");
        status.textContent = "DANGER!";
      }

      obstacleTimer -= delta;

      if (obstacleTimer <= 0) {

        createObstacle();

        obstacleTimer =
          600 + Math.random() * 500;
      }

      animalTimer -= delta;

      if (animalTimer <= 0) {

        createAnimal();

        animalTimer =
          900 + Math.random() * 900;
      }

    } else {

      obstacleTimer -= delta;

      if (obstacleTimer <= 0) {

        createObstacle();

        obstacleTimer =
          1100 + Math.random() * 900;
      }
    }

    moveObstacles(delta, elapsed);

    checkCollisions();

    if (remaining <= 0) {

      win();
      return;
    }

    animationId = requestAnimationFrame(loop);
  }

  document.addEventListener("keydown", e => {

    if (
      e.code === "ArrowUp" ||
      e.code === "Space"
    ) {

      e.preventDefault();
      jump();
    }
  });

  jumpBtn.addEventListener("pointerdown", e => {

    e.preventDefault();
    jump();
  });

  retryBtn.addEventListener("click", resetGame);

  player.addEventListener("error", () => {

    player.alt = "Running man";
  });

  resetGame();

})();
</script>

</body>
</html>
