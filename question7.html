<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question 7 - Help Me Get To Work!</title><link rel="stylesheet" href="style.css">
<style>
.runner{width:min(1050px,100%);text-align:center}.game{position:relative;height:clamp(290px,50vw,440px);overflow:hidden;border:4px solid #222;border-radius:20px;background:linear-gradient(#8bdcff 0 68%,#78b84b 68% 72%,#383838 72%);isolation:isolate}.cloud{position:absolute;font-size:45px;opacity:.7}.c1{top:25px;left:15%}.c2{top:70px;left:70%}.city{position:absolute;bottom:28%;left:0;width:200%;display:flex;gap:10px;align-items:end}.city i{display:block;width:70px;height:var(--h);background:#58708055;border-radius:5px 5px 0 0}.road{position:absolute;bottom:0;left:0;width:200%;height:28%;background:repeating-linear-gradient(90deg,#333 0 65px,#3d3d3d 65px 130px);border-top:6px solid #74bd42}.player{position:absolute;z-index:20;left:13%;bottom:22%;width:clamp(58px,9vw,90px);pointer-events:none}.running{animation:run .16s infinite alternate}@keyframes run{to{transform:translateY(-5px) rotate(2deg)}}.obstacle,.animal{position:absolute;z-index:15;right:-100px;bottom:21%;font-size:clamp(42px,7vw,70px);line-height:1;pointer-events:none}.animal{z-index:16;bottom:21%;animation:walk .35s infinite alternate}@keyframes walk{to{transform:translateY(-4px) rotate(2deg)}}.office{position:absolute;z-index:5;right:15px;bottom:24%;font-size:clamp(55px,9vw,95px)}.danger{position:absolute;z-index:50;top:10px;left:50%;transform:translate(-50%,-80px);opacity:0;background:#e63946;color:white;padding:8px 15px;border-radius:99px;font-weight:900;transition:.3s}.danger.show{transform:translate(-50%,0);opacity:1}.jump{margin-top:10px;width:min(280px,100%);padding:15px;border:0;border-radius:15px;background:#222;color:#fff;font-weight:900;cursor:pointer}.result{display:none;position:absolute;z-index:100;inset:0;background:#000a;place-items:center;padding:15px}.result.show{display:grid}.resultbox{width:min(480px,100%);background:#fff;border-radius:22px;padding:25px}.retry{padding:12px 18px;border:0;border-radius:12px;background:#222;color:#fff;font-weight:900}.continue{display:inline-block;padding:12px 18px;border-radius:12px;background:#1e9c63;color:#fff;text-decoration:none;font-weight:900}
</style></head>
<body data-step="7"><main class="stage runner"><header class="hud" id="hud"></header><section class="card"><h1 class="q">🏃 HELP ME GET TO WORK!</h1><p>Survive exactly 20 seconds. Jump with ↑ or SPACE.</p><div class="game" id="game"><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="city"><i style="--h:90px"></i><i style="--h:130px"></i><i style="--h:75px"></i><i style="--h:150px"></i><i style="--h:105px"></i><i style="--h:135px"></i><i style="--h:80px"></i><i style="--h:120px"></i></div><div class="office">🏢</div><img id="player" class="player running" src="https://pngimg.com/uploads/businessman/businessman_PNG6583.png" alt="Running man"><div class="road"></div><div class="danger" id="danger">⚠️ DANGER MODE!</div><div class="result" id="result"><div class="resultbox"><h2 id="rt"></h2><p id="rp"></p><button id="retry" class="retry">🔄 TRY AGAIN</button><a id="continue" class="continue" href="question8.html" hidden>Continue to Question 8 →</a></div></div></div><button id="jump" class="jump">⬆️ JUMP</button><p>Don't let me die! 😭</p></section></main><script src="effects.js"></script><script>
(()=>{const game=document.getElementById("game"),player=document.getElementById("player"),timer=document.getElementById("hud"),danger=document.getElementById("danger"),result=document.getElementById("result"),rt=document.getElementById("rt"),rp=document.getElementById("rp"),retry=document.getElementById("retry"),cont=document.getElementById("continue"),jumpBtn=document.getElementById("jump");let running,dead,jumping,start,last,jumpStart,obs=[],animals=[],ot,at,raf;const total=20000;
function reset(){obs.forEach(a=>a.el.remove());animals.forEach(a=>a.el.remove());obs=[];animals=[];running=true;dead=false;jumping=false;start=last=performance.now();ot=900;at=0;danger.classList.remove("show");result.classList.remove("show");retry.hidden=false;cont.hidden=true;player.classList.add("running");player.style.bottom="22%";raf=requestAnimationFrame(loop)}
function jump(){if(!running||dead||jumping)return;jumping=true;jumpStart=performance.now();player.classList.remove("running");(function a(){if(!jumping)return;let p=Math.min((performance.now()-jumpStart)/700,1);player.style.bottom=(22+Math.sin(p*Math.PI)*27)+"%";if(p>=1){jumping=false;player.style.bottom="22%";player.classList.add("running")}else requestAnimationFrame(a)})()}
function makeObstacle(){let e=document.createElement("div");e.className="obstacle";e.textContent=["📦","🛒","🚗","🪑"][Math.floor(Math.random()*4)];game.appendChild(e);obs.push({el:e,x:game.clientWidth+100})}
function makeAnimal(){let e=document.createElement("div");e.className="animal";e.textContent=Math.random()<.5?"🐱":"🐶";game.appendChild(e);animals.push({el:e,x:game.clientWidth+100})}
function hit(a,b){let A=a.getBoundingClientRect(),B=b.getBoundingClientRect();return A.left+A.width*.25<B.right-B.width*.15&&A.right-A.width*.25>B.left+B.width*.15&&A.bottom-A.height*.05>B.top+B.height*.15&&A.top+A.height*.2<B.bottom}
function die(){if(dead)return;dead=true;running=false;cancelAnimationFrame(raf);rt.textContent="💀 YOU KILLED ME!";rp.textContent="I trusted you... 😭 Try again!";result.classList.add("show")}
function loop(now){if(!running||dead)return;let d=now-last;last=now;let elapsed=now-start,rem=Math.max(0,total-elapsed);timer.innerHTML=`<div class="tally"><span class="pill">❤️ ${ (rem/1000).toFixed(1)}s</span></div>`;if(elapsed<10000){ot-=d;if(ot<=0){makeObstacle();ot=1300+Math.random()*800}}else{danger.classList.add("show");ot-=d;at-=d;if(ot<=0){makeObstacle();ot=750+Math.random()*550}if(at<=0){makeAnimal();at=1300+Math.random()*1000}}let os=elapsed>=10000?390:270;obs.forEach(a=>{a.x-=os*d/1000;a.el.style.right=(game.clientWidth-a.x)+"px"});animals.forEach(a=>{a.x-=150*d/1000;a.el.style.right=(game.clientWidth-a.x)+"px"});obs=obs.filter(a=>{if(a.x<-150){a.el.remove();return false}return true});animals=animals.filter(a=>{if(a.x<-150){a.el.remove();return false}return true});if(!jumping){for(const a of [...obs,...animals])if(hit(player,a.el)){die();return}}if(rem<=0){running=false;rt.textContent="🏢 YOU SAVED ME!";rp.textContent="I KNEW I COULD TRUST YOU! 🎉 +1 POINT";retry.hidden=true;cont.hidden=false;result.classList.add("show");Quiz.answer(true,"You saved me!","You didn't make it!",()=>{});Quiz.confetti();return}raf=requestAnimationFrame(loop)}
document.addEventListener("keydown",e=>{if(e.code==="ArrowUp"||e.code==="Space"){e.preventDefault();jump()}});jumpBtn.addEventListener("pointerdown",e=>{e.preventDefault();jump()});retry.onclick=reset;reset()})();
</script></body></html>
