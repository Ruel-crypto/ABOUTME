<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 4 - About Me Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-step="4">
    <main class="stage">
      <header class="hud" id="hud"></header>

      <section class="card">
        <h1 class="q">What do I enjoy outside of work?</h1>
        <div class="answers" role="group" aria-label="Answers">
          <button class="tile" data-correct="false"><span class="key">1</span>Sleeping</button>
          <button class="tile" data-correct="true"><span class="key">2</span>Gaming</button>
          <button class="tile" data-correct="false"><span class="key">3</span>Watching TV</button>
          <button class="tile" data-correct="false"><span class="key">4</span>Running</button>
        </div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <a id="next" class="btn" href="question5.html" hidden>Next question</a>
      </section>
    </main>

    <script src="effects.js"></script>
    <script>
      Quiz.multipleChoice({
        right: "Exactly! I enjoy gaming and fun activities. 🎮",
        wrong: "Not this one — gaming is more my thing."
      });
    </script>
  </body>
</html>
