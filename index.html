<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me Quiz</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 700px;
      }

      .card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
        overflow: hidden;
      }

      .top {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 32px 20px 20px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.85;
      }

      h1 {
        margin: 0;
        font-size: 2.3em;
      }

      .progress-wrap {
        height: 8px;
        background: #eaeaea;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        transition: width 0.4s ease;
      }

      .progress-text {
        text-align: center;
        color: #666;
        font-weight: 700;
        padding: 12px 0 0;
        font-size: 0.9em;
      }

      main {
        padding: 30px 26px 36px;
        min-height: 360px;
      }

      .hidden {
        display: none !important;
      }

      .screen {
        display: block;
      }

      .input-box,
      .question-box {
        text-align: center;
      }

      h2 {
        font-size: 2em;
        margin-bottom: 24px;
        color: #333;
      }

      input[type="text"] {
        width: 100%;
        padding: 16px 18px;
        border-radius: 12px;
        border: 2px solid #d9d9d9;
        font-size: 1.05em;
        outline: none;
        margin-bottom: 16px;
      }

      input[type="text"]:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
      }

      .submit-btn,
      .next-btn,
      .answer-btn {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .submit-btn,
      .next-btn {
        width: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 16px;
        font-size: 1em;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .submit-btn:hover,
      .next-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(102, 126, 234, 0.25);
      }

      .error-message {
        color: #d93025;
        font-weight: 700;
        margin-top: 14px;
        font-size: 1.05em;
      }

      .answer-area {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .answer-btn {
        background: #f5f5f9;
        border: 2px solid #dde3f2;
        padding: 16px 18px;
        text-align: left;
        font-size: 1em;
        color: #333;
        font-weight: 600;
      }

      .answer-btn:hover:not(.disabled) {
        transform: translateX(4px);
        border-color: #667eea;
        background: #edf2ff;
      }

      .answer-btn.correct {
        background: #2bb673;
        border-color: #2bb673;
        color: white;
      }

      .answer-btn.incorrect {
        background: #db3b3b;
        border-color: #db3b3b;
        color: white;
      }

      .answer-btn.disabled {
        pointer-events: none;
      }

      .result-box {
        text-align: center;
        padding: 10px 0 20px;
      }

      .result-message {
        font-size: 2.2em;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .result-message.correct {
        color: #2bb673;
      }

      .result-message.incorrect {
        color: #db3b3b;
      }

      .result-text {
        color: #555;
        font-size: 1.08em;
        line-height: 1.6;
      }

      .score-box {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        color: white;
        text-align: center;
        padding: 24px 18px;
        margin-bottom: 16px;
      }

      .score-num {
        font-size: 3em;
        font-weight: 800;
        margin: 12px 0;
      }

      .score-message {
        font-size: 1.1em;
        line-height: 1.5;
      }

      #finalScreen h2 {
        text-align: center;
        margin-bottom: 18px;
      }

      .confetti-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .confetti {
        position: absolute;
        top: -20px;
        width: 12px;
        height: 12px;
        opacity: 1;
        animation: fall 3s ease-in forwards;
      }

      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(540deg);
          opacity: 0;
        }
      }

      @media (max-width: 600px) {
        h2 {
          font-size: 1.5em;
        }

        main {
          padding: 24px 18px 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <header class="top">
          <p class="eyebrow">Fun fact challenge</p>
          <h1>About Me Quiz</h1>
        </header>

        <div class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="progressText" class="progress-text">Question 1 of 5</p>

        <main>
          <section id="nameScreen" class="screen">
            <div class="input-box">
              <h2>What's your name?</h2>
              <input id="nameInput" type="text" placeholder="Enter your name..." />
              <button id="submitNameButton" class="submit-btn">Submit</button>
              <p id="nameError" class="error-message hidden">Wrong name, try again! 👀</p>
            </div>
          </section>

          <section id="questionScreen" class="screen hidden">
            <div class="question-box">
              <h2 id="questionText">Question goes here</h2>
              <div id="answerArea" class="answer-area"></div>
            </div>
          </section>

          <section id="resultScreen" class="screen hidden">
            <div id="resultBox" class="result-box"></div>
            <button id="continueButton" class="next-btn">Continue</button>
          </section>

          <section id="finalScreen" class="screen hidden">
            <h2>Quiz complete!</h2>
            <div id="scoreBox" class="score-box"></div>
            <button id="restartButton" class="next-btn">Play Again</button>
          </section>
        </main>
      </div>
    </div>

    <div id="confettiContainer" class="confetti-container"></div>

    <script>
      const questions = [
        {
          question: "Who are you to the handsome man?",
          type: "input",
          accepted: ["co-worker", "coworker", "workmates", "officemates"],
          success: "Correct! You're part of the team. 💼",
          fail: "Not quite. Try again!"
        },
        {
          question: "What is my favorite programming language?",
          type: "multiple",
          answers: ["Python", "JavaScript", "Go", "Rust"],
          correctIndex: 1,
          success: "Correct! JavaScript is my favorite. 🚀",
          fail: "Not this one — I love JavaScript!"
        },
        {
          question: "What is my go-to drink?",
          type: "multiple",
          answers: ["Coffee", "Tea", "Energy drink", "Water"],
          correctIndex: 0,
          success: "Yep! Coffee is my go-to. ☕",
          fail: "Not quite — I’m a coffee person."
        },
        {
          question: "What do I enjoy outside of work?",
          type: "multiple",
          answers: ["Sleeping", "Gaming", "Watching TV", "Running"],
          correctIndex: 1,
          success: "Exactly! I enjoy gaming and fun activities. 🎮",
          fail: "Not this one — gaming is more my thing."
        },
        {
          question: "How many years have I been coding?",
          type: "multiple",
          answers: ["1 year", "3 years", "5 years", "10+ years"],
          correctIndex: 2,
          success: "Correct! I’ve been coding for 5 years. 🔥",
          fail: "Not this time — it’s been 5 years."
        }
      ];

      const nameScreen = document.getElementById("nameScreen");
      const questionScreen = document.getElementById("questionScreen");
      const resultScreen = document.getElementById("resultScreen");
      const finalScreen = document.getElementById("finalScreen");
      const questionText = document.getElementById("questionText");
      const answerArea = document.getElementById("answerArea");
      const resultBox = document.getElementById("resultBox");
      const progressBar = document.getElementById("progressBar");
      const progressText = document.getElementById("progressText");
      const nameInput = document.getElementById("nameInput");
      const nameError = document.getElementById("nameError");
      const scoreBox = document.getElementById("scoreBox");
      const confettiContainer = document.getElementById("confettiContainer");

      let currentQuestionIndex = 0;
      let score = 0;
      let answered = false;

      function updateProgress() {
        const totalQuestions = questions.length;
        const percent = ((currentQuestionIndex + 1) / totalQuestions) * 100;
        progressBar.style.width = percent + "%";
        progressText.textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
      }

      function showNameScreen() {
        nameScreen.classList.remove("hidden");
        questionScreen.classList.add("hidden");
        resultScreen.classList.add("hidden");
        finalScreen.classList.add("hidden");
        nameError.classList.add("hidden");
        nameInput.value = "";
        nameInput.focus();
      }

      function createConfetti() {
        const colors = ["#ffd700", "#ff69b4", "#00bfff", "#32cd32", "#ff8c00", "#ffffff"];

        for (let i = 0; i < 60; i++) {
          const piece = document.createElement("div");
          piece.className = "confetti";
          piece.style.left = Math.random() * 100 + "%";
          piece.style.background = colors[Math.floor(Math.random() * colors.length)];
          piece.style.animationDelay = Math.random() * 0.4 + "s";
          confettiContainer.appendChild(piece);
        }

        setTimeout(() => {
          confettiContainer.innerHTML = "";
        }, 3000);
      }

      document.getElementById("submitNameButton").addEventListener("click", () => {
        const value = nameInput.value.trim().toLowerCase();

        if (value === "jamaica") {
          nameError.classList.add("hidden");
          createConfetti();
          setTimeout(() => {
            score = 0;
            currentQuestionIndex = 0;
            showQuestion();
          }, 900);
          return;
        }

        nameError.classList.remove("hidden");
        nameInput.value = "";
        nameInput.focus();
      });

      function showQuestion() {
        const question = questions[currentQuestionIndex];
        answered = false;

        nameScreen.classList.add("hidden");
        questionScreen.classList.remove("hidden");
        resultScreen.classList.add("hidden");
        finalScreen.classList.add("hidden");

        questionText.textContent = question.question;
        answerArea.innerHTML = "";

        if (question.type === "input") {
          const input = document.createElement("input");
          input.type = "text";
          input.placeholder = "Type your answer...";
          input.style.width = "100%";
          input.style.padding = "16px 18px";
          input.style.borderRadius = "12px";
          input.style.border = "2px solid #d9d9d9";
          input.style.fontSize = "1.05em";
          input.style.marginBottom = "16px";

          const button = document.createElement("button");
          button.className = "submit-btn";
          button.textContent = "Submit";

          button.addEventListener("click", () => {
            if (answered) return;

            const value = input.value.trim().toLowerCase();
            const isCorrect = question.accepted.includes(value);

            answered = true;
            handleAnswer(isCorrect, question.success, question.fail);
          });

          input.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
              button.click();
            }
          });

          answerArea.appendChild(input);
          answerArea.appendChild(button);
          input.focus();

          updateProgress();
          return;
        }

        question.answers.forEach((answer, index) => {
          const button = document.createElement("button");
          button.className = "answer-btn";
          button.textContent = answer;

          button.addEventListener("click", () => {
            if (answered) return;

            answered = true;
            const isCorrect = index === question.correctIndex;
            handleAnswer(isCorrect, question.success, question.fail);
          });

          answerArea.appendChild(button);
        });

        updateProgress();
      }

      function handleAnswer(isCorrect, successText, failText) {
        const correctIndex = questions[currentQuestionIndex].correctIndex;

        const buttons = document.querySelectorAll(".answer-btn");
        if (buttons.length) {
          buttons.forEach((btn) => {
            btn.classList.add("disabled");
          });

          if (typeof correctIndex === "number") {
            buttons[correctIndex].classList.add("correct");
          }
        }

        const input = answerArea.querySelector("input");
        const submitBtn = answerArea.querySelector(".submit-btn");

        if (input) input.disabled = true;
        if (submitBtn) submitBtn.disabled = true;

        if (isCorrect) {
          score += 1;
        }

        resultScreen.classList.remove("hidden");
        questionScreen.classList.add("hidden");

        resultBox.innerHTML = `
          <div class="result-message ${isCorrect ? "correct" : "incorrect"}">
            ${isCorrect ? "✓ Correct!" : "✗ Incorrect"}
          </div>
          <div class="result-text">
            ${isCorrect ? successText : failText}
          </div>
        `;
      }

      document.getElementById("continueButton").addEventListener("click", () => {
        currentQuestionIndex += 1;

        if (currentQuestionIndex < questions.length) {
          showQuestion();
        } else {
          showFinalScreen();
        }
      });

      function showFinalScreen() {
        const total = questions.length;
        const percentage = Math.round((score / total) * 100);

        let message = "";
        if (percentage === 100) {
          message = "Perfect! You know everything! 🌟";
        } else if (percentage >= 80) {
          message = "Awesome! You really know me well! 🎉";
        } else if (percentage >= 60) {
          message = "Good job! You know me pretty well. 😊";
        } else if (percentage >= 40) {
          message = "Not bad at all! We should hang out more. 😄";
        } else {
          message = "We need to get to know each other better! 😜";
        }

        resultScreen.classList.add("hidden");
        finalScreen.classList.remove("hidden");

        scoreBox.innerHTML = `
          <div>🏆</div>
          <div class="score-num">${score}/${total}</div>
          <div class="score-message">${percentage}%<br>${message}</div>
        `;
      }

      document.getElementById("restartButton").addEventListener("click", () => {
        currentQuestionIndex = 0;
        score = 0;
        showNameScreen();
      });

      showNameScreen();
    </script>
  </body>
</html>
