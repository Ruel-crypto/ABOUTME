<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Me Quiz</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 700px;
      }

      .card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.22);
        overflow: hidden;
      }

      .top {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 32px 20px 20px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 2px;
        opacity: 0.85;
      }

      h1 {
        margin: 0;
        font-size: 2.3em;
      }

      .progress-wrap {
        height: 8px;
        background: #eaeaea;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        transition: width 0.4s ease;
      }

      .progress-text {
        text-align: center;
        color: #666;
        font-weight: 700;
        padding: 12px 0 0;
        font-size: 0.9em;
      }

      main {
        padding: 30px 26px 36px;
        min-height: 360px;
      }

      .hidden {
        display: none !important;
      }

      .screen {
        display: block;
      }

      .input-box,
      .question-box {
        text-align: center;
      }

      h2 {
        font-size: 2em;
        margin-bottom: 24px;
        color: #333;
      }

      input[type="text"] {
        width: 100%;
        padding: 16px 18px;
        border-radius: 12px;
        border: 2px solid #d9d9d9;
        font-size: 1.05em;
        outline: none;
        margin-bottom: 16px;
      }

      input[type="text"]:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
      }

      .submit-btn,
      .next-btn,
      .answer-btn {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .submit-btn,
      .next-btn {
        width: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 16px;
        font-size: 1em;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .submit-btn:hover,
      .next-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(102, 126, 234, 0.25);
      }

      .error-message {
        color: #d93025;
        font-weight: 700;
        margin-top: 14px;
        font-size: 1.05em;
      }

      .answer-area {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .answer-btn {
        background: #f5f5f9;
        border: 2px solid #dde3f2;
        padding: 16px 18px;
        text-align: left;
        font-size: 1em;
        color: #333;
        font-weight: 600;
      }

      .answer-btn:hover:not(.disabled) {
        transform: translateX(4px);
        border-color: #667eea;
        background: #edf2ff;
      }

      .answer-btn.correct {
        background: #2bb673;
        border-color: #2bb673;
        color: white;
      }

      .answer-btn.incorrect {
        background: #db3b3b;
        border-color: #db3b3b;
        color: white;
      }

      .answer-btn.disabled {
        pointer-events: none;
      }

      .result-box {
        text-align: center;
        padding: 10px 0 20px;
      }

      .result-gif {
        display: block;
        max-width: 100%;
        max-height: 260px;
        margin: 0 auto 18px;
        border-radius: 12px;
      }

      .result-message {
        font-size: 2.2em;
        font-weight: 800;
        margin-bottom: 14px;
      }

      .result-message.correct {
        color: #2bb673;
      }

      .result-message.incorrect {
        color: #db3b3b;
      }

      .result-text {
        color: #555;
        font-size: 1.08em;
        line-height: 1.6;
      }

      .score-box {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 16px;
        color: white;
        text-align: center;
        padding: 24px 18px;
        margin-bottom: 16px;
      }

      .score-num {
        font-size: 3em;
        font-weight: 800;
        margin: 12px 0;
      }

      .score-message {
        font-size: 1.1em;
        line-height: 1.5;
      }

      #finalScreen h2 {
        text-align: center;
        margin-bottom: 18px;
      }

      .confetti-container {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }

      .confetti {
        position: absolute;
        top: -20px;
        width: 12px;
        height: 12px;
        opacity: 1;
        animation: fall 3s ease-in forwards;
      }

      @keyframes fall {
        0% {
          transform: translateY(0) rotate(0deg);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) rotate(540deg);
          opacity: 0;
        }
      }

      @media (max-width: 600px) {
        h2 {
          font-size: 1.5em;
        }

        main {
          padding: 24px 18px 28px;
        }

        .result-gif {
          max-height: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <header class="top">
          <p class="eyebrow">Fun fact challenge</p>
          <h1>About Me Quiz</h1>
        </header>

        <div class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>
        <p id="progressText" class="progress-text">Question 1 of 5</p>

        <main>
          <section id="nameScreen" class="screen">
            <div class="input-box">
              <h2>What's your name?</h2>
              <input id="nameInput" type="text" placeholder="Enter your name..." />
              <button id="submitNameButton" class="submit-btn">Submit</button>
              <p id="nameError" class="error-message hidden">Wrong name, try again! 👀</p>
            </div>
          </section>

          <section id="questionScreen" class="screen hidden">
            <div class="question-box">
              <h2 id="questionText">Question goes here</h2>
              <div id="answerArea" class="answer-area"></div>
            </div>
          </section>

          <section id="resultScreen" class="screen hidden">
            <div id="resultBox" class="result-box"></div>
            <button id="continueButton" class="next-btn">Continue</button>
          </section>

          <section id="finalScreen" class="screen hidden">
            <h2>Quiz complete!</h2>
            <div id="scoreBox" class="score-box"></div>
            <button id="restartButton" class="next-btn">Play Again</button>
          </section>
        </main>
      </div>
    </div>

    <div id="confettiContainer" class="confetti-container"></div>

    <script src="script.js"></script>
  </body>
</html>
