<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question 10 - Royal Fashion Show</title><link rel="stylesheet" href="style.css"><style>.fashion{text-align:center}.stagepic{position:relative;width:min(460px,100%);height:330px;margin:auto;border-radius:22px;overflow:hidden;background:radial-gradient(circle,#fff,#ffe8f5,#e9ddff);border:2px solid #ead1ee;display:grid;place-items:center}.stagepic img{width:100%;height:100%;object-fit:contain;padding:10px}.princess{font-size:125px}.nameplate{position:absolute;bottom:10px;left:10px;right:10px;background:#fffc;padding:8px;border-radius:10px;font-weight:900}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.choice{padding:13px;border:2px solid #e5d9ee;border-radius:13px;background:#fff9ff;font-weight:900;cursor:pointer}.choice.correct{background:#d8ffe5;border-color:#22a06b}.choice.wrong{background:#ffe0e0;border-color:#e34b4b}.final{display:none;margin-top:18px;padding:18px;background:#fff0c7;border-radius:18px}.final.show{display:block}@media(max-width:430px){.choices{grid-template-columns:1fr}.stagepic{height:285px}}</style></head><body data-step="10"><main class="stage"><header class="hud" id="hud"></header><section class="card fashion"><h1 class="q">✨ THE ROYAL FASHION SHOW ✨</h1><p>Who is my favorite Disney princess?</p><p id="round"><b>Contestant 1 of 5</b></p><div class="stagepic" id="pic"><div class="princess">👸</div><div class="nameplate">The Royal Runway</div></div><div class="choices" id="choices"><button class="choice" data-a="Cinderella">Cinderella 👠</button><button class="choice" data-a="Ariel">Ariel 🧜‍♀️</button><button class="choice" data-a="Belle">Belle 🌹</button><button class="choice" data-a="Jasmine">Princess Jasmine 💎</button><button class="choice" data-a="Mulan">Mulan 🌸</button></div><p id="feedback" class="feedback">Make your choice, fashion critic! 💅</p><div id="final" class="final"><h2>👑 IT'S PRINCESS JASMINE! 💎</h2><p>YES! My favorite Disney princess is Jasmine! 🎉</p><a class="btn" href="results.html">🏆 SEE MY RESULTS</a></div></section></main><script src="effects.js"></script><script>
(()=>{const img="https://i.etsystatic.com/23994028/r/il/8b6916/2449049474/il_fullxfull.2449049474_po33.jpg",names=["Cinderella","Ariel","Belle","Jasmine","Mulan"],em=["👠","🧜‍♀️","🌹","💎","🌸"],pic=document.getElementById("pic"),round=document.getElementById("round"),fb=document.getElementById("feedback"),final=document.getElementById("final"),buttons=[...document.querySelectorAll(".choice")];let r=0,locked=false;function show(){pic.innerHTML="";if(names[r]==="Jasmine"){let im=document.createElement("img");im.src=img;im.alt="Princess Jasmine";im.onerror=()=>{im.remove();let e=document.createElement("div");e.className="princess";e.textContent="💎";pic.prepend(e)};pic.appendChild(im)}else{let e=document.createElement("div");e.className="princess";e.textContent=em[r];pic.appendChild(e)}let n=document.createElement("div");n.className="nameplate";n.textContent=names[r];pic.appendChild(n);round.innerHTML=`<b>Contestant ${r+1} of 5</b>`;buttons.forEach(b=>{b.disabled=false;b.className="choice"})}buttons.forEach(b=>b.onclick=()=>{if(locked)return;let ok=b.dataset.a==="Jasmine";buttons.forEach(x=>{x.disabled=true;if(x.dataset.a==="Jasmine")x.classList.add("correct")});if(ok){locked=true;b.classList.add("correct");fb.textContent="YESSS! PRINCESS JASMINE! 💎👑";final.classList.add("show");Quiz.answer(true,"Correct! Jasmine is my favorite! 👑","Not quite! Jasmine is my favorite.",()=>{});Quiz.confetti()}else{b.classList.add("wrong");fb.textContent="Pretty princess, but not my favorite! 👀";setTimeout(()=>{r=(r+1)%5;show()},900)}});show()})();
</script></body></html>
